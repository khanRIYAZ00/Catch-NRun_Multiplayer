<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CatchNRun Display</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    margin: 0;
    padding: 24px;
    background: linear-gradient(135deg, #0f172a, #111827 40%, #1e293b);
    color: #f8fafc;
    font-family: Arial, sans-serif;
  }

  h1 {
    margin-bottom: 8px;
    letter-spacing: 0.08em;
  }

  .hud {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    font-weight: 700;
  }

  #gameCanvas {
    background: #0f172a;
    border: 3px solid rgba(148, 163, 184, 0.5);
    box-shadow: 0 18px 30px rgba(15, 23, 42, 0.45);
    border-radius: 14px;
  }

  #newGameButton {
    display: inline-block;
    margin: 0 0 16px;
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
  }

  #qrCodes {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 26px;
  }

  .qr-card {
    background: rgba(15, 23, 42, 0.78);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 14px;
    padding: 14px;
    min-width: 170px;
    box-shadow: 0 12px 20px rgba(0,0,0,0.18);
  }

  .qr-card canvas {
    display: block;
    margin: 0 auto 8px auto;
    border-radius: 10px;
    background: white;
    padding: 4px;
  }

  .qr-card .role {
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.12em;
    margin-bottom: 6px;
    opacity: 0.9;
  }

  .qr-card .link {
    font-size: 12px;
    word-break: break-all;
    opacity: 0.85;
  }
</style>
</head>

<body>
  <h1>CatchNRun</h1>

  <div class="hud">
    <p id="timer">Time: 120</p>
    <p id="builderCount">Builder: 0</p>
    <p id="eraserCount">Eraser: 0</p>
  </div>

  <button id="newGameButton" type="button">New Game</button>

  <canvas id="gameCanvas"></canvas>

  <div id="qrCodes"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <script src="qr.js"></script>
  <script src="display.js"></script>
</body>
</html>
